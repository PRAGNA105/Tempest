[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-trace"
version = "0.1.0"
description = "Deterministic semantic leak detection demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "networkx>=3.0",
]

[project.scripts]
semantic-trace = "semantic_trace.__main__:main"

[tool.setuptools.packages.find]
include = ["semantic_trace*"]

[tool.setuptools.package-data]
semantic_trace = ["policy_config.example.json"]